<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+KR:wght@300;400&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/config.js"></script>
<script src="/assets/auth.js"></script>
</head>
<body>
<header class="mast"><div class="wrap">
  <a class="brand" href="/"><b data-site-name>유지보수 요청 접수</b><span class="mono">Maintenance Desk</span></a>
  <nav class="nav" id="nav"></nav>
</div></header>

<main class="wrap narrow">
  <p class="mono kicker">Sign In</p>
  <h1 class="page-title" id="title">로그인</h1>

  <form class="card" id="loginForm" novalidate>
    <div class="field"><label for="email">이메일</label><input type="email" id="email" autocomplete="email" required></div>
    <div class="field"><label for="pw">비밀번호</label><input type="password" id="pw" autocomplete="current-password" required></div>
    <div class="msg err" id="err" role="alert" hidden></div>
    <div style="margin-top:16px"><button class="btn block" id="go">로그인</button></div>
    <div class="links"><a href="/signup">처음이면 회원가입</a><a href="#" id="forgot">비밀번호를 잊었어요</a></div>
  </form>

  <form class="card" id="recoverForm" novalidate hidden>
    <p class="sub">가입한 이메일을 적어 주시면 비밀번호를 다시 정하는 링크를 보내 드려요.</p>
    <div class="field"><label for="remail">이메일</label><input type="email" id="remail" autocomplete="email" required></div>
    <div class="msg" id="rmsg" role="alert" hidden></div>
    <div style="margin-top:16px"><button class="btn block">링크 보내기</button></div>
    <div class="links"><a href="/login">로그인으로 돌아가기</a></div>
  </form>

  <form class="card" id="resetForm" novalidate hidden>
    <p class="sub">새 비밀번호를 정해 주세요. (8자 이상)</p>
    <div class="field"><label for="npw">새 비밀번호</label><input type="password" id="npw" autocomplete="new-password" minlength="8" required></div>
    <div class="msg" id="nmsg" role="alert" hidden></div>
    <div style="margin-top:16px"><button class="btn block">비밀번호 바꾸기</button></div>
  </form>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const say = (el, text, ok) => { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); el.hidden = false; };

  // 비밀번호 다시 설정 메일 링크로 왔을 때
  const h = new URLSearchParams(location.hash.slice(1));
  const recoveryToken = h.get('type') === 'recovery' && h.get('access_token');
  if (recoveryToken) {
    $('loginForm').hidden = true; $('resetForm').hidden = false; $('title').textContent = '새 비밀번호';
    history.replaceState(null, '', '/login');
  } else if (Auth.session()) {
    location.replace('/my');
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('pw').value;
    if (!email || !password) return say($('err'), '이메일과 비밀번호를 적어 주세요.');
    $('go').disabled = true;
    try {
      const r = await Auth.call('token?grant_type=password', { body: { email, password } });
      if (!r.ok) {
        const notConfirmed = /confirm/i.test(r.data.msg || r.data.error_description || r.data.error_code || '');
        return say($('err'), notConfirmed ? '가입 확인 메일의 링크를 먼저 눌러 주세요.' : '이메일 또는 비밀번호가 맞지 않아요.');
      }
      Auth.save(r.data);
      location.href = '/my';
    } catch (err) { say($('err'), err.message || '잠시 뒤 다시 시도해 주세요.'); }
    finally { $('go').disabled = false; }
  });

  $('forgot').onclick = (e) => {
    e.preventDefault();
    $('loginForm').hidden = true; $('recoverForm').hidden = false; $('title').textContent = '비밀번호 찾기';
    $('remail').value = $('email').value;
  };

  $('recoverForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('remail').value.trim();
    if (!email) return say($('rmsg'), '이메일을 적어 주세요.');
    try { await Auth.call('recover?redirect_to=' + encodeURIComponent(location.origin + '/login'), { body: { email } }); } catch {}
    // 가입 여부는 알려 주지 않는다
    say($('rmsg'), '메일을 확인해 주세요. 링크를 누르면 새 비밀번호를 정할 수 있어요.', true);
  });

  $('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = $('npw').value;
    if (password.length < 8) return say($('nmsg'), '비밀번호는 8자 이상으로 정해 주세요.');
    const r = await Auth.call('user', { method: 'PUT', body: { password }, token: recoveryToken }).catch(() => ({ ok: false }));
    if (!r.ok) return say($('nmsg'), '바꾸지 못했어요. 비밀번호 찾기를 다시 해 주세요.');
    say($('nmsg'), '비밀번호를 바꿨어요. 새 비밀번호로 로그인해 주세요.', true);
    setTimeout(() => location.replace('/login'), 1500);
  });
})();
</script>
</body>
</html>
