<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>내 요청 내역</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Noto+Serif+KR:wght@300;400&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/config.js"></script>
<script src="/assets/auth.js"></script>
</head>
<body>
<header class="mast"><div class="wrap">
  <a class="brand" href="/"><b data-site-name>유지보수 요청 접수</b><span class="mono">Maintenance Desk</span></a>
  <nav class="nav" id="nav"></nav>
</div></header>

<main class="wrap read">
  <p class="mono kicker">My Requests</p>
  <h1 class="page-title">내 요청 내역</h1>
  <p id="who" style="color:var(--muted);margin:-8px 0 16px"></p>
  <div style="margin-bottom:16px"><a class="btn" href="/#request">새 요청 남기기</a></div>
  <div class="msg err" id="err" hidden></div>
  <div class="list" id="list"><div class="empty">불러오는 중…</div></div>

  <details class="leave" id="leave">
    <summary>회원 탈퇴</summary>
    <form id="leaveForm" novalidate>
      <p>탈퇴하면 계정이 바로 지워지고 이 이메일로 다시 로그인할 수 없어요. 이미 남긴 요청은 처리를 위해 <a href="/privacy">개인정보 처리방침</a>의 보관 기간 동안 남아 있어요.</p>
      <div class="field"><label for="leavePw">비밀번호 확인</label><input type="password" id="leavePw" autocomplete="current-password" required></div>
      <div class="msg err" id="leaveErr" role="alert" hidden></div>
      <button class="btn danger block" id="leaveBtn">탈퇴하기</button>
    </form>
  </details>
</main>
<script src="/assets/editor.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
  const date = (s) => new Date(s).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  const s = Auth.session();
  if (!s) { location.replace('/login'); return; }

  $('leaveForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('leaveErr'), btn = $('leaveBtn');
    err.hidden = true;
    const password = $('leavePw').value;
    if (!password) { err.textContent = '비밀번호를 적어 주세요.'; err.hidden = false; return; }
    if (!confirm('정말 탈퇴할까요? 되돌릴 수 없어요.')) return;
    btn.disabled = true;
    try {
      const r = await fetch('/api/delete-account', {
        method: 'POST', headers: { Authorization: `Bearer ${s.access_token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { Auth.clear(); location.replace('/login'); return; }
      if (!r.ok) throw new Error(d.error || '탈퇴하지 못했어요.');
      Auth.clear();
      document.querySelector('main').innerHTML = '<h1 class="page-title">탈퇴했어요</h1><p>계정을 지웠어요. 요청은 로그인 없이도 언제든 남길 수 있어요.</p><a class="btn" href="/">첫 화면으로</a>';
      Auth.nav();
    } catch (x) { err.textContent = x.message; err.hidden = false; btn.disabled = false; }
  });

  // 고객 상태 4가지: 접수됨 · 처리 중 · 확인 필요 · 완료
  const statusClass = { '접수됨': 'new', '처리 중': 'doing', '확인 필요': 'hurry', '완료': 'done' };
  const STEP = { '접수됨': 1, '처리 중': 2, '확인 필요': 2, '완료': 3 };
  const hm = (min) => { const h = Math.floor(min / 60), m = min % 60; return h ? `${h}시간${m ? ' ' + m + '분' : ''}` : `${m}분`; };
  let data = null;
  function drawList() {
    const d = data;
    $('who').textContent = d.company
      ? `${d.email} 계정 · ${d.company} 담당자예요. 회사 요청을 모두 보여 드려요.`
      : (d.email ? `${d.email} 계정으로 로그인했어요.` : '');
    if (!d.rows.length) {
      $('list').innerHTML = d.company
        ? '<div class="empty">아직 회사 요청이 없어요.</div>'
        : '<div class="empty">아직 남긴 요청이 없어요.<br>받으신 회사 전용 링크에서 로그인하면 회사 요청을 모두 볼 수 있어요.</div>';
      return;
    }
    $('list').innerHTML = d.rows.map((row) => `
      <article class="item${row.urgency === '업무 중단 중' ? ' stop' : ''}">
        <div class="meta">
          <span class="pill ${statusClass[row.status] || ''}">${esc(row.status)}</span>
          <span class="no" style="font-family:var(--mono)">${esc(row.no)}</span><span>${date(row.created_at)}</span>
          ${row.urgency !== '보통' ? `<span class="pill ${row.urgency === '업무 중단 중' ? 'stop' : 'hurry'}">${esc(row.urgency)}</span>` : ''}
          ${row.completed_at ? `<span>완료 ${date(row.completed_at)}</span>` : ''}
        </div>
        <div class="mini st-${STEP[row.status] || 1}" aria-hidden="true"><span></span><span></span><span></span></div>
        <h3>${esc(row.kind)} · ${esc(row.program)}</h3>
        <div class="body-view" data-body="${row.id}"></div>
        <ul class="files-view" data-files="${row.id}" hidden></ul>
        ${(row.images || []).length ? `<div class="shots">${row.images.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="캡처 ${i + 1}" loading="lazy"></a>`).join('')}</div>` : ''}
        ${row.approval_status === '요청함' ? `
          <div class="approve" data-ap="${row.id}">
            <b>유료 작업 동의 요청</b>
            <p>${esc(row.approval_note || '')}<br><span style="color:var(--muted)">예상 작업 시간 ${hm(row.approval_minutes || 0)} · 요청 ${date(row.approval_requested_at)}</span></p>
            <p class="hint" style="margin:0 0 10px">동의하시면 작업을 시작해요. 비용은 계약에 따라 안내해요.</p>
            <div class="ap-btns"><button type="button" class="btn" data-dec="동의">진행 동의</button><button type="button" class="btn ghost" data-dec="거절">동의하지 않음</button></div>
          </div>` : row.approval_status ? `<p class="approved">유료 작업: <b>${row.approval_status === '동의' ? '동의함' : '동의하지 않음'}</b> (${date(row.approval_decided_at)})</p>` : ''}
      </article>`).join('');
    for (const row of d.rows) {
      Editor.render(document.querySelector(`[data-body="${row.id}"]`), row.body, row.message);
      Editor.renderFiles(document.querySelector(`[data-files="${row.id}"]`), row.attachments);
    }
  }
  function loadList() {
    return fetch('/api/my-requests', { headers: { Authorization: `Bearer ${s.access_token}` } })
      .then(async (r) => {
        const d = await r.json().catch(() => ({}));
        if (r.status === 401) { Auth.clear(); location.replace('/login'); return; }
        if (!r.ok) throw new Error(d.error || '불러오지 못했어요.');
        data = d; drawList();
      });
  }
  // 유료 작업 동의/거절
  $('list').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-dec]'); if (!b) return;
    const box = b.closest('[data-ap]');
    const id = Number(box.dataset.ap), decision = b.dataset.dec;
    if (!confirm(decision === '동의' ? '이 작업 진행에 동의할까요?' : '이 작업에 동의하지 않을까요?')) return;
    box.querySelectorAll('button').forEach((x) => { x.disabled = true; });
    try {
      const r = await fetch('/api/my-requests', { method: 'POST', headers: { Authorization: `Bearer ${s.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ id, decision }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || '저장하지 못했어요.');
      await loadList();
    } catch (x) { $('err').textContent = x.message; $('err').hidden = false; box.querySelectorAll('button').forEach((y) => { y.disabled = false; }); }
  });

  Auth.join().catch(() => null)
    .then(loadList)
    .catch((err) => { $('list').innerHTML = ''; $('err').textContent = err.message; $('err').hidden = false; });
})();
</script>
</body>
</html>
