<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>요청함 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
  .sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 24px 0 12px; }
  .sum button { text-align: left; background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 10px 12px; font: inherit; color: var(--muted); cursor: pointer; }
  .sum button b { display: block; font: 700 30px/1.1 var(--head); color: var(--ink); font-variant-numeric: tabular-nums; }
  .sum button.on { background: var(--ink); color: #fff; border-color: var(--ink); border-top-color: var(--c); }
  .sum button.on b { color: #fff; }
  .sum .all { grid-column: 1 / -1; border-top-width: 1px; padding: 8px 12px; text-align: center; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .filters button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 15px; cursor: pointer; color: var(--ink); }
  .filters button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .who { font-size: 15px; margin: 0 0 8px; }
  .copy { font: inherit; background: var(--bg); border: 1px dashed #cdd3dd; border-radius: 6px; padding: 2px 8px; cursor: pointer; color: var(--ink); }
  .states { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .states button { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 15px; cursor: pointer; color: var(--muted); }
  .states button.on { color: #fff; font-weight: 700; border-color: transparent; }
  .states button.on[data-s="새 요청"] { background: var(--accent); }
  .states button.on[data-s="처리 중"] { background: var(--amber); }
  .states button.on[data-s="완료"] { background: var(--green); }
  .late-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; margin: 24px 0 0; padding: 12px 14px; border: 1px solid #f1c3bf; border-radius: 10px; background: var(--red-soft); color: var(--red); font: inherit; font-weight: 600; text-align: left; cursor: pointer; }
  .late-bar b { font: 700 22px/1 var(--head); font-variant-numeric: tabular-nums; }
  .late-bar span:last-child { font-size: 14px; white-space: nowrap; text-decoration: underline; }
  .late-bar + .sum { margin-top: 12px; }
  .item.late { border-color: var(--red); box-shadow: inset 0 0 0 1px var(--red); }
  .wait { color: var(--red); font-weight: 700; }
  .trend { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0 16px; }
  .trend-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 20px; }
  .trend-head h2 { font: 700 16px/1.3 var(--head); margin: 0; }
  .trend-head span { color: var(--muted); font-size: 14px; }
  .chart { position: relative; display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; height: 120px; align-items: end; border-bottom: 1px solid #cdd3dd; }
  .chart .col { position: relative; height: 100%; display: flex; align-items: flex-end; }
  .chart .col i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; }
  .chart .col:hover i, .chart .col:focus-visible i { background: #1a3ea6; }
  .chart .col:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chart .peak { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 700; color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 4px; }
  .tip { position: absolute; z-index: 5; pointer-events: none; transform: translate(-50%, -100%); background: var(--ink); color: #fff; font-size: 13px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
  .trend details { margin-top: 8px; font-size: 14px; }
  .trend summary { cursor: pointer; color: var(--muted); }
  .trend table { border-collapse: collapse; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .trend td, .trend th { padding: 2px 12px 2px 0; text-align: left; font-weight: 400; }
  .csv { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 0 0 16px; }
  .csv .btn { min-height: 44px; font-size: 15px; padding: 0 16px; }
  .csv .hint { margin: 0; }
  .memo { display: flex; gap: 6px; margin: 0 0 10px; }
  .memo input { flex: 1; min-width: 0; min-height: 44px; padding: 8px 12px; font-size: 15px; background: #fffdf3; border-color: #e6dcb0; }
  .memo button { flex: none; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 15px; cursor: pointer; color: var(--ink); }
  .memo button:disabled { color: var(--muted); cursor: default; }
  .tabs { display: flex; gap: 4px; margin: 20px 0 0; border-bottom: 1px solid var(--line); }
  .tabs button { min-height: 44px; padding: 0 16px; border: 0; border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; font: 600 16px/1 var(--head); color: var(--muted); cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .mem-count { margin: 20px 0 12px; color: var(--muted); }
  .mem-count b { font: 700 30px/1 var(--head); color: var(--ink); margin-right: 6px; font-variant-numeric: tabular-nums; }
  .member { display: grid; gap: 2px; }
  .member .email { font: inherit; font-weight: 600; word-break: break-all; text-align: left; padding: 6px 0; background: none; border: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .del-row { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .del { min-height: 40px; padding: 0 10px; border: 0; background: none; font: inherit; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .del:hover, .del:focus-visible { color: var(--red); }
  .pick { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; margin: -6px 0 -6px -6px; cursor: pointer; }
  .pick input { width: 20px; height: 20px; margin: 0; cursor: pointer; accent-color: var(--accent); }
  .item.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: #f7f9ff; }
  .sel-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--ink); color: #fff;
  }
  .sel-bar span { margin-right: auto; }
  .sel-bar b { font: 700 20px/1 var(--head); font-variant-numeric: tabular-nums; margin-right: 2px; }
  .sel-bar button { min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.35); background: none; color: #fff; font: inherit; font-size: 14px; cursor: pointer; }
  .sel-bar button.danger { background: var(--red); border-color: var(--red); font-weight: 700; }
  .sel-on .toast { bottom: 120px; }
  @media (min-width: 720px) { .sel-bar { left: 50%; right: auto; transform: translateX(-50%); bottom: 16px; border-radius: 12px; width: min(688px, calc(100% - 32px)); } }
  .del-row .edit-btn { margin-right: auto; }
  .del-row .edit-btn:hover, .del-row .edit-btn:focus-visible { color: var(--accent); }
  .edited { color: var(--amber); font-weight: 600; }
  .edit { display: grid; gap: 10px; margin: 4px 0 12px; padding: 12px; border-radius: 10px; background: var(--bg); }
  .edit label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
  .edit input, .edit select, .edit textarea { min-height: 44px; font-size: 15px; padding: 8px 12px; font-weight: 400; }
  .edit textarea { min-height: 110px; }
  .edit-grid { display: grid; gap: 10px; }
  @media (min-width: 560px) { .edit-grid { grid-template-columns: 1fr 1fr; } }
  .edit .hint { margin: 0; }
  .edit-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .edit-actions button { min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: inherit; font-size: 15px; cursor: pointer; color: var(--ink); }
  .edit-actions .primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .search { margin: 0 0 10px; }
  .search input { min-height: 48px; }
  .search .hint { margin: 4px 0 0; min-height: 0; }
  .search .hint:empty { display: none; }
  .user-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--ink); font-size: 15px; }
  .user-bar b { word-break: break-all; }
  .user-bar button { flex: none; min-height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--card); color: var(--accent); font: inherit; font-size: 14px; cursor: pointer; }
  .member .when { color: var(--muted); font-size: 14px; }
  .mem-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .reqs { flex: none; color: var(--muted); font-size: 14px; white-space: nowrap; }
  .reqs b { font: 700 18px/1 var(--head); color: var(--ink); font-variant-numeric: tabular-nums; }
  .reqs small { font-size: 13px; color: var(--amber); }
  .bar { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<header class="top"><div class="wrap bar">
  <span class="brand">요청함 관리</span>
  <nav class="nav"><button type="button" id="reload" hidden>새로고침</button><button type="button" id="out" hidden>잠그기</button></nav>
</div></header>

<main class="wrap">
  <form class="card narrow" id="lock" style="margin:32px auto">
    <h2>관리자 비밀번호</h2>
    <p class="sub">비밀번호는 이 탭을 닫으면 지워져요.</p>
    <div class="field"><input type="password" id="pw" autocomplete="current-password" aria-label="관리자 비밀번호" required></div>
    <div class="msg err" id="lockErr" role="alert" hidden></div>
    <button class="btn block" id="enter">열기</button>
  </form>

  <section id="box" hidden>
    <div class="tabs" role="tablist" aria-label="보기">
      <button type="button" role="tab" id="tabReq" aria-selected="true" aria-controls="reqView">요청함</button>
      <button type="button" role="tab" id="tabMem" aria-selected="false" aria-controls="memView">회원</button>
    </div>
    <div id="reqView" role="tabpanel" aria-labelledby="tabReq">
    <div class="user-bar" id="userBar" hidden><span><b id="userEmail"></b> 회원의 요청만 보는 중</span><button type="button" id="userClear">모든 요청 보기</button></div>
    <button type="button" class="late-bar" id="late" hidden><span>48시간 넘게 기다린 새 요청 <b id="lateN">0</b>건</span><span id="lateGo">모아 보기</span></button>
    <div class="sum" id="fStatus">
      <button type="button" data-v="새 요청" style="--c:var(--accent)"><b data-n="새 요청">0</b>새 요청</button>
      <button type="button" data-v="처리 중" style="--c:var(--amber)"><b data-n="처리 중">0</b>처리 중</button>
      <button type="button" data-v="완료" style="--c:var(--green)"><b data-n="완료">0</b>완료</button>
      <button type="button" data-v="" class="all on">전체 보기</button>
    </div>
    <section class="trend" aria-labelledby="trendTitle">
      <div class="trend-head"><h2 id="trendTitle">최근 30일 접수</h2><span id="trendSum"></span></div>
      <div class="chart" id="chart" role="img"></div>
      <div class="axis"><span id="axisFrom"></span><span>오늘</span></div>
      <details><summary>표로 보기</summary><table id="trendTable"><thead><tr><th>날짜</th><th>접수</th></tr></thead><tbody></tbody></table></details>
    </section>
    <div class="search">
      <input type="search" id="q" placeholder="검색: 회사·이름·연락처·내용·메모, #접수번호" aria-label="요청 검색" autocomplete="off">
      <p class="hint" id="qInfo" aria-live="polite"></p>
    </div>
    <div class="filters" id="fUrg" style="margin-bottom:16px">
      <button type="button" data-v="" class="on">급한 정도 전체</button>
      <button type="button" data-v="업무 중단 중">업무 중단 중</button>
      <button type="button" data-v="급함">급함</button>
      <button type="button" data-v="보통">보통</button>
    </div>
    <div class="csv">
      <button type="button" class="btn ghost" id="csv">지금 보이는 목록 내려받기 (CSV)</button>
      <p class="hint">개인정보가 들어 있어요. 보관에 주의하세요.</p>
    </div>
    <div class="msg err" id="err" hidden></div>
    <div class="list" id="list"></div>
    </div>

    <div id="memView" role="tabpanel" aria-labelledby="tabMem" hidden>
      <p class="mem-count"><b id="memN">0</b>명이 가입했어요</p>
      <div class="msg err" id="memErr" hidden></div>
      <div class="list" id="memList"></div>
      <p class="hint" style="margin-top:16px">회원을 지우거나 비밀번호를 바꾸는 일은 Supabase 화면(Authentication → Users)에서 해 주세요. 회원이 직접 탈퇴할 수도 있어요.<br>요청 수는 로그인하고 남긴 요청만 세요. "진행 중"은 아직 완료되지 않은 요청이에요.</p>
    </div>
    <div style="height:96px"></div>
    <div class="sel-bar" id="selBar" hidden>
      <span><b id="selN">0</b>건 선택됨</span>
      <button type="button" id="selAll">보이는 것 모두 선택</button>
      <button type="button" id="selNone">선택 풀기</button>
      <button type="button" class="danger" id="selDel">선택한 요청 삭제</button>
    </div>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const KEY = 'mr_admin';
  const STATUSES = ['새 요청', '처리 중', '완료'];
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
  const date = (s) => new Date(s).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  // 완료한 날부터 1년 뒤 (실제 삭제는 그다음 새벽 청소 때)
  const delDate = (s) => { const d = new Date(s); d.setFullYear(d.getFullYear() + 1); return d.toLocaleDateString('ko-KR'); };
  const getPw = () => { try { return sessionStorage.getItem(KEY) || ''; } catch { return ''; } };
  const setPw = (v) => { try { v ? sessionStorage.setItem(KEY, v) : sessionStorage.removeItem(KEY); } catch {} };
  let rows = [];
  let memPw = getPw();
  const filter = { status: '', urgency: '', late: false, user: '', userEmail: '', q: '' };
  // 여러 개 삭제용 선택: 화면에 보이는 요청만 선택된 채로 남는다 (안 보이는 요청이 지워지는 일을 막기 위해)
  const picked = new Set();
  function drawPicked() {
    for (const id of picked) if (!shown.some((r) => r.id === id)) picked.delete(id);
    $('selBar').hidden = !picked.size || tab !== 'req';
    document.body.classList.toggle('sel-on', !$('selBar').hidden);
    $('selN').textContent = picked.size;
  }
  // 검색: 띄어 쓴 단어가 모두 들어 있어야 맞음. "#12"는 접수 번호로 찾는다
  const matches = (r) => {
    const words = filter.q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!words.length) return true;
    const text = [r.company, r.name, r.contact, r.program, r.message, r.memo, r.kind].join(' ').toLowerCase();
    return words.every((w) => (/^#\d+$/.test(w) ? String(r.id) === w.slice(1) : text.includes(w)));
  };
  // 새 요청인 채로 48시간이 지났는지
  const LATE_MS = 48 * 3600 * 1000;
  const isLate = (r) => r.status === '새 요청' && Date.now() - new Date(r.created_at) > LATE_MS;
  const waited = (s) => { const h = Math.floor((Date.now() - new Date(s)) / 3600000); return h < 72 ? h + '시간째 기다리는 중' : Math.floor(h / 24) + '일째 기다리는 중'; };

  async function api(method, body, query = '') {
    const r = await fetch('/api/admin' + query, {
      method, headers: { 'x-admin-password': memPw, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) { lock('비밀번호가 맞지 않아요.'); throw new Error('locked'); }
    if (!r.ok) throw new Error(d.error || '문제가 생겼어요.');
    return d;
  }

  function lock(msg) {
    memPw = ''; setPw('');
    $('box').hidden = true; $('lock').hidden = false; $('reload').hidden = true; $('out').hidden = true;
    $('pw').value = '';
    if (msg) { $('lockErr').textContent = msg; $('lockErr').hidden = false; }
    $('pw').focus();
  }

  async function load() {
    $('err').hidden = true;
    try {
      const d = await api('GET');
      rows = d.rows;
      $('lock').hidden = true; $('box').hidden = false; $('reload').hidden = false; $('out').hidden = false; $('lockErr').hidden = true;
      draw();
    } catch (e) {
      if (e.message !== 'locked') { $('err').textContent = e.message; $('err').hidden = false; $('lock').hidden = true; $('box').hidden = false; }
    }
  }

  // 최근 30일 날짜별 접수 수 (오늘이 오른쪽 끝, 이 기기의 날짜 기준)
  const dayKey = (d) => `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  const md = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일`;
  function drawTrend() {
    const days = [];
    const today = new Date(); today.setHours(0, 0, 0, 0);
    for (let i = 29; i >= 0; i--) { const d = new Date(today); d.setDate(d.getDate() - i); days.push({ d, n: 0 }); }
    const idx = Object.fromEntries(days.map((x, i) => [dayKey(x.d), i]));
    rows.forEach((r) => { const i = idx[dayKey(new Date(r.created_at))]; if (i !== undefined) days[i].n++; });
    const max = Math.max(...days.map((x) => x.n));
    const total = days.reduce((s, x) => s + x.n, 0);
    const peakAt = max ? days.map((x) => x.n).lastIndexOf(max) : -1;
    $('trendSum').textContent = `모두 ${total}건`;
    $('axisFrom').textContent = md(days[0].d);
    $('chart').setAttribute('aria-label', `최근 30일 동안 ${total}건 접수, 하루 최대 ${max}건`);
    $('chart').innerHTML = days.map((x, i) => {
      const h = max ? (x.n / max) * 100 : 0;
      const peak = i === peakAt ? `<span class="peak" style="bottom:calc(${h}% + 2px)">${max}</span>` : '';
      return `<div class="col" tabindex="0" data-tip="${md(x.d)} ${x.n}건"><i style="height:${h}%"></i>${peak}</div>`;
    }).join('');
    $('trendTable').tBodies[0].innerHTML = days.slice().reverse().map((x) => `<tr><td>${md(x.d)}</td><td>${x.n}건</td></tr>`).join('');
  }
  // 막대에 마우스를 올리거나 손가락으로 누르면 날짜와 건수
  (function () {
    const chart = $('chart');
    let tip = null;
    const hide = () => { if (tip) { tip.remove(); tip = null; } };
    const show = (col) => {
      if (!col) return hide();
      if (!tip) { tip = document.createElement('div'); tip.className = 'tip'; chart.appendChild(tip); }
      tip.textContent = col.dataset.tip;
      // 양 끝 막대에서도 말풍선이 차트 밖으로 나가지 않게
      const half = tip.offsetWidth / 2;
      tip.style.left = Math.min(Math.max(col.offsetLeft + col.offsetWidth / 2, half), chart.clientWidth - half) + 'px';
      tip.style.top = '-6px';
    };
    chart.addEventListener('pointerover', (e) => show(e.target.closest('.col')));
    chart.addEventListener('pointerleave', hide);
    chart.addEventListener('focusin', (e) => show(e.target.closest('.col')));
    chart.addEventListener('focusout', hide);
  })();

  // 지금 화면에 보이는 목록 = 필터가 걸린 목록
  let shown = [];

  // CSV 내려받기: 엑셀에서 한글이 깨지지 않게 맨 앞에 BOM, 수식으로 읽힐 수 있는 칸은 글자로 바꾼다
  const cell = (v) => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const stamp = (s) => (s ? new Date(s).toLocaleString('ko-KR') : '');
  $('csv').onclick = () => {
    if (!shown.length) return toast('내려받을 요청이 없어요');
    const head = ['접수 번호', '접수 일시', '회사', '이름', '연락처', '프로그램', '요청 종류', '급한 정도', '내용', '상태', '완료 일시', '회원', '캡처 수', '메모'];
    const lines = shown.map((r) => [r.id, stamp(r.created_at), r.company, r.name, r.contact, r.program, r.kind, r.urgency, r.message, r.status, stamp(r.completed_at), r.user_id ? '예' : '', (r.images || []).length, r.memo]);
    const csv = '﻿' + [head, ...lines].map((l) => l.map(cell).join(',')).join('\r\n');
    const d = new Date();
    const name = `requests_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.csv`;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast(`${shown.length}건을 내려받았어요`);
  };

  function draw() {
    drawTrend();
    if (editing.id && !rows.some((r) => r.id === editing.id)) { editing.id = null; editing.v = null; }
    document.querySelectorAll('[data-n]').forEach((el) => { el.textContent = rows.filter((r) => r.status === el.dataset.n).length; });
    const lateN = rows.filter(isLate).length;
    if (!lateN) filter.late = false;
    $('late').hidden = !lateN;
    $('lateN').textContent = lateN;
    $('lateGo').textContent = filter.late ? '전체 보기' : '모아 보기';
    // 저장하지 않은 메모는 목록을 다시 그려도 남겨 둔다
    const drafts = {};
    document.querySelectorAll('.memo').forEach((f) => {
      const r = rows.find((x) => String(x.id) === f.dataset.id);
      const v = f.elements[0].value;
      if (r && v !== (r.memo ?? '')) drafts[r.id] = v;
    });
    $('userBar').hidden = !filter.user;
    $('userEmail').textContent = filter.userEmail;
    const list = shown = rows.filter((r) => matches(r) && (!filter.user || r.user_id === filter.user) &&(!filter.late || isLate(r)) && (!filter.status || r.status === filter.status) && (!filter.urgency || r.urgency === filter.urgency));
    drawPicked();
    if (!list.length) {
      const onlyUser = filter.user && !filter.status && !filter.urgency && !filter.late && !filter.q.trim();
      $('qInfo').textContent = filter.q.trim() ? '검색 결과 0건' : '';
      $('list').innerHTML = `<div class="empty">${onlyUser ? '이 회원이 로그인하고 남긴 요청이 없어요.'
        : filter.q.trim() ? `‘${esc(filter.q.trim())}’에 맞는 요청이 없어요. 다른 단어로 찾거나 위 필터를 풀어 보세요.` : '보여 줄 요청이 없어요.'}</div>`;
      return;
    }
    $('qInfo').textContent = filter.q.trim() ? `검색 결과 ${list.length}건` : '';
    $('list').innerHTML = list.map((r) => `
      <article class="item${r.urgency === '업무 중단 중' ? ' stop' : ''}${isLate(r) ? ' late' : ''}${picked.has(r.id) ? ' picked' : ''}">
        <div class="meta">
          <label class="pick"><input type="checkbox" data-pick="${r.id}"${picked.has(r.id) ? ' checked' : ''} aria-label="#${r.id} 선택"></label>
          <span>#${r.id}</span><span>${date(r.created_at)}</span>
          ${isLate(r) ? `<span class="wait">${waited(r.created_at)}</span>` : ""}
          ${r.urgency !== '보통' ? `<span class="pill ${r.urgency === '업무 중단 중' ? 'stop' : 'hurry'}">${esc(r.urgency)}</span>` : ''}
          <span class="pill">${esc(r.kind)}</span>
          ${r.user_id ? '<span class="pill">회원</span>' : ''}
          ${r.status === '완료' && r.completed_at ? `<span>${delDate(r.completed_at)} 자동 삭제 예정</span>` : ''}
          ${r.edited_at ? `<span class="edited" title="${esc(new Date(r.edited_at).toLocaleString('ko-KR'))}">관리자 수정 ${date(r.edited_at)}</span>` : ''}
        </div>
        ${editing.id === r.id ? editForm(r) : `
        <h3>${esc(r.company)} · ${esc(r.program)}</h3>
        <p class="who">${esc(r.name)} · <button type="button" class="copy" data-copy="${esc(r.contact)}">${esc(r.contact)}</button></p>
        <p class="text">${esc(r.message)}</p>`}
        ${r.images.length ? `<div class="shots">${r.images.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="캡처 ${i + 1}" loading="lazy"></a>`).join('')}</div>` : ''}
        <form class="memo" data-id="${r.id}">
          <input type="text" maxlength="500" placeholder="메모 (관리자만 보여요)" aria-label="#${r.id} 메모" value="${esc(drafts[r.id] ?? r.memo ?? '')}">
          <button type="submit"${drafts[r.id] === undefined ? ' disabled' : ''}>저장</button>
        </form>
        <div class="states">${STATUSES.map((s) => `<button type="button" data-id="${r.id}" data-s="${s}" class="${r.status === s ? 'on' : ''}">${s}</button>`).join('')}</div>
        <div class="del-row">${editing.id === r.id ? '' : `<button type="button" class="del edit-btn" data-edit="${r.id}">수정</button>`}<button type="button" class="del" data-del="${r.id}">요청 삭제</button></div>
      </article>`).join('');
  }

  // 요청 내용 고치기: 한 번에 한 카드만. 고치던 내용은 목록을 다시 그려도 남는다
  const KINDS = ['오류', '수정 요청', '사용 문의'];
  const URGENCIES = ['보통', '급함', '업무 중단 중'];
  const editing = { id: null, v: null };
  function editForm(r) {
    const v = editing.v;
    const opt = (list, cur) => list.map((x) => `<option${x === cur ? ' selected' : ''}>${x}</option>`).join('');
    const f = (name, label, max) => `<label>${label}<input type="text" name="${name}" maxlength="${max}" value="${esc(v[name])}" required></label>`;
    return `
        <form class="edit" data-id="${r.id}">
          <div class="edit-grid">
            ${f('company', '회사', 100)}${f('program', '프로그램', 100)}
            ${f('name', '이름', 50)}${f('contact', '연락처', 100)}
            <label>요청 종류<select name="kind">${opt(KINDS, v.kind)}</select></label>
            <label>급한 정도<select name="urgency">${opt(URGENCIES, v.urgency)}</select></label>
          </div>
          <label>내용<textarea name="message" maxlength="3000" required>${esc(v.message)}</textarea></label>
          <p class="hint">화면 캡처와 접수 일시는 바뀌지 않아요. 저장하면 "관리자 수정"으로 표시돼요.</p>
          <div class="edit-actions"><button type="button" data-edit-cancel>취소</button><button type="submit" class="primary">저장</button></div>
        </form>`;
  }
  $('list').addEventListener('input', (e) => {
    const f = e.target.closest('form.edit'); if (!f || !e.target.name) return;
    editing.v[e.target.name] = e.target.value;
  });
  $('list').addEventListener('submit', async (e) => {
    const f = e.target.closest('form.edit'); if (!f) return;
    e.preventDefault();
    const id = Number(f.dataset.id);
    const btn = f.querySelector('[type="submit"]');
    btn.disabled = true;
    try {
      await api('PATCH', { id, edit: editing.v });
      const r = rows.find((x) => x.id === id);
      const t = (s) => String(s).trim();
      Object.assign(r, { company: t(editing.v.company), name: t(editing.v.name), contact: t(editing.v.contact), program: t(editing.v.program), kind: editing.v.kind, urgency: editing.v.urgency, message: t(editing.v.message), edited_at: new Date().toISOString() });
      editing.id = null; editing.v = null;
      draw();
      toast(`#${id} 요청을 고쳤어요`);
    } catch (err) {
      btn.disabled = false;
      if (err.message !== 'locked') { $('err').textContent = err.message; $('err').hidden = false; $('err').scrollIntoView({ block: 'center' }); }
    }
  });

  // 메모: 고치면 [저장]이 켜지고, 저장하면 다시 꺼진다
  // 선택 칸
  $('list').addEventListener('change', (e) => {
    const c = e.target.closest('[data-pick]'); if (!c) return;
    const id = Number(c.dataset.pick);
    c.checked ? picked.add(id) : picked.delete(id);
    c.closest('.item').classList.toggle('picked', c.checked);
    drawPicked();
  });
  $('selAll').onclick = () => { shown.forEach((r) => picked.add(r.id)); draw(); };
  $('selNone').onclick = () => { picked.clear(); draw(); };
  $('selDel').onclick = async () => {
    const ids = [...picked];
    if (!ids.length) return;
    if (ids.length > 100) return toast('한 번에 100건까지 지울 수 있어요');
    const shots = rows.filter((r) => picked.has(r.id)).reduce((n, r) => n + r.images.length, 0);
    if (!confirm(`선택한 요청 ${ids.length}건을 지울까요?${shots ? ` 화면 캡처 ${shots}장도 함께 지워지고,` : ''} 되돌릴 수 없어요.`)) return;
    const btn = $('selDel');
    btn.disabled = true;
    try {
      const d = await api('DELETE', { ids });
      const gone = new Set(d.deleted || ids);
      rows = rows.filter((r) => !gone.has(r.id));
      picked.clear();
      draw();
      toast(`요청 ${gone.size}건을 지웠어요`);
    } catch (err) {
      if (err.message !== 'locked') { $('err').textContent = err.message; $('err').hidden = false; }
    } finally { btn.disabled = false; }
  };

  $('list').addEventListener('input', (e) => {
    const f = e.target.closest('.memo'); if (!f) return;
    const r = rows.find((x) => String(x.id) === f.dataset.id);
    f.elements[1].disabled = f.elements[0].value === (r.memo ?? '');
  });
  $('list').addEventListener('submit', async (e) => {
    const f = e.target.closest('.memo'); if (!f) return;
    e.preventDefault();
    const btn = f.elements[1];
    if (btn.disabled) return;
    btn.disabled = true;
    try {
      const memo = f.elements[0].value.trim();
      await api('PATCH', { id: Number(f.dataset.id), memo });
      const r = rows.find((x) => String(x.id) === f.dataset.id);
      r.memo = memo || null;
      f.elements[0].value = memo;
      toast(memo ? `#${r.id} 메모를 저장했어요` : `#${r.id} 메모를 지웠어요`);
    } catch (err) {
      btn.disabled = false;
      if (err.message !== 'locked') { $('err').textContent = err.message; $('err').hidden = false; }
    }
  });

  $('list').addEventListener('click', async (e) => {
    const c = e.target.closest('[data-copy]');
    if (c) {
      try { await navigator.clipboard.writeText(c.dataset.copy); const t = c.textContent; c.textContent = '복사했어요'; setTimeout(() => { c.textContent = t; }, 1200); }
      catch { const sel = getSelection(); const rg = document.createRange(); rg.selectNodeContents(c); sel.removeAllRanges(); sel.addRange(rg); }
      return;
    }
    const ed = e.target.closest('[data-edit]');
    if (ed) {
      const r = rows.find((x) => x.id === Number(ed.dataset.edit));
      if (editing.id && editing.id !== r.id && !confirm(`#${editing.id} 요청을 고치는 중이에요. 저장하지 않고 이 요청을 고칠까요?`)) return;
      editing.id = r.id;
      editing.v = { company: r.company, program: r.program, name: r.name, contact: r.contact, kind: r.kind, urgency: r.urgency, message: r.message };
      draw();
      const f = document.querySelector(`form.edit[data-id="${r.id}"]`);
      if (f) { f.scrollIntoView({ block: 'center' }); f.elements.company.focus(); }
      return;
    }
    if (e.target.closest('[data-edit-cancel]')) { editing.id = null; editing.v = null; draw(); return; }
    const del = e.target.closest('[data-del]');
    if (del) {
      const id = Number(del.dataset.del);
      const r = rows.find((x) => x.id === id);
      const shots = r && r.images.length ? ` 화면 캡처 ${r.images.length}장도` : '';
      if (!confirm(`#${id} 요청을 지울까요?${shots ? shots + ' 함께 지워지고,' : ''} 되돌릴 수 없어요.`)) return;
      del.disabled = true;
      try {
        await api('DELETE', { id });
        rows = rows.filter((x) => x.id !== id);
        draw();
        toast(`#${id} 요청을 지웠어요`);
      } catch (err) {
        del.disabled = false;
        if (err.message !== 'locked') { $('err').textContent = err.message; $('err').hidden = false; }
      }
      return;
    }
    const b = e.target.closest('[data-s][data-id]');
    if (!b || b.classList.contains('on')) return;
    b.disabled = true;
    try { await api('PATCH', { id: Number(b.dataset.id), status: b.dataset.s }); await load(); toast(`#${b.dataset.id} 요청을 '${b.dataset.s}'(으)로 바꿨어요`); }
    catch (err) { if (err.message !== 'locked') { $('err').textContent = err.message; $('err').hidden = false; } }
    finally { b.disabled = false; }
  });

  function toast(text) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = document.createElement('div');
    t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  }

  const bindFilter = (id, key) => $(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    filter[key] = b.dataset.v; filter.late = false;
    $(id).querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    draw();
  });
  bindFilter('fStatus', 'status');
  bindFilter('fUrg', 'urgency');

  $('lock').addEventListener('submit', (e) => {
    e.preventDefault();
    memPw = $('pw').value;
    if (!memPw) return;
    setPw(memPw);
    load();
  });
  // 늦은 요청 모아 보기 ↔ 전체 보기
  $('late').onclick = () => {
    filter.late = !filter.late;
    if (filter.late) {
      filter.status = ''; filter.urgency = '';
      document.querySelectorAll('#fStatus button, #fUrg button').forEach((x) => x.classList.toggle('on', x.dataset.v === ''));
    }
    draw();
  };
  // 회원 탭: 처음 열 때와 [새로고침] 때 불러온다
  let tab = 'req';
  async function loadMembers() {
    $('memErr').hidden = true;
    try {
      const { members } = await api('GET', null, '?view=members');
      $('memN').textContent = members.length;
      const day = (s) => (s ? new Date(s).toLocaleString('ko-KR', { year: 'numeric', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '');
      $('memList').innerHTML = members.length
        ? members.map((m) => `
          <article class="item member">
            <div class="mem-top"><button type="button" class="email" data-uid="${esc(m.id)}" data-email="${esc(m.email)}" title="이 회원의 요청만 보기">${esc(m.email)}</button><span class="reqs">${m.requests ? `요청 <b>${m.requests}</b>건${m.open ? ` <small>(진행 중 ${m.open})</small>` : ''}` : '요청 없음'}</span></div>
            <span class="when">가입 ${day(m.created_at)}${m.confirmed ? '' : ' · 메일 확인 전'}</span>
            <span class="when">마지막 로그인 ${m.last_sign_in_at ? day(m.last_sign_in_at) : '없음'}</span>
          </article>`).join('')
        : '<div class="empty">아직 가입한 회원이 없어요.</div>';
    } catch (e) {
      if (e.message !== 'locked') { $('memErr').textContent = e.message; $('memErr').hidden = false; }
    }
  }
  function showTab(t) {
    tab = t;
    $('tabReq').setAttribute('aria-selected', t === 'req');
    $('tabMem').setAttribute('aria-selected', t === 'mem');
    $('reqView').hidden = t !== 'req';
    $('memView').hidden = t !== 'mem';
    drawPicked();
    if (t === 'mem') loadMembers();
  }
  // 회원 이메일을 누르면 요청함에서 그 회원의 요청만
  $('memList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-uid]'); if (!b) return;
    filter.user = b.dataset.uid; filter.userEmail = b.dataset.email;
    showTab('req'); draw(); scrollTo(0, 0);
  });
  // 적는 대로 바로 걸러 보기 (입력이 멈추면 다시 그린다)
  let qTimer;
  $('q').addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { filter.q = $('q').value; draw(); }, 150);
  });
  $('userClear').onclick =() => { filter.user = ''; filter.userEmail = ''; draw(); };

  $('tabReq').onclick = () => showTab('req');
  $('tabMem').onclick = () => showTab('mem');

  $('reload').onclick = () => (tab === 'mem' ? loadMembers() : load());
  $('out').onclick = () => lock();

  if (memPw) load(); else $('pw').focus();
})();
</script>
</body>
</html>
